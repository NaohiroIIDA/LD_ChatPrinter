<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ChatPrinter</title>
<meta name="description" content="キャラクターが吹き出しで喋る画像を LX-D02 サーマルプリンタで印刷">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #efece6;
    --card: #fbfaf7;
    --paper: #ffffff;
    --text: #22201c;
    --muted: #77726a;
    --border: #dcd7ce;
    --accent: #22201c;
    --accent-text: #fbfaf7;
    --focus: #c2410c;
    --danger: #b91c1c;
    --ok: #15803d;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161513;
      --card: #201f1c;
      --paper: #f4f1ea;
      --text: #ece8e0;
      --muted: #9d978c;
      --border: #3a3732;
      --accent: #ece8e0;
      --accent-text: #161513;
      --focus: #fb923c;
      --danger: #f87171;
      --ok: #4ade80;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 "Zen Maru Gothic", "Hiragino Maru Gothic ProN", system-ui, sans-serif;
  }
  main {
    max-width: 960px;
    margin: 0 auto;
    padding: 20px 16px 48px;
  }
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }
  h1 { margin: 0; font-size: 26px; font-weight: 700; flex: 1; letter-spacing: 0.01em; }
  h1 small { display: block; font-size: 13px; font-weight: 500; color: var(--muted); }
  #connect {
    display: inline-flex; align-items: center; gap: 8px;
    min-height: 40px; padding: 6px 14px;
    border: 1px solid var(--border); border-radius: 999px;
    background: var(--card); color: var(--text);
    font: inherit; font-size: 14px; cursor: pointer;
  }
  #connect .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
  #connect.on .dot { background: var(--ok); }
  #banner {
    display: none;
    padding: 10px 14px; margin-bottom: 16px;
    border: 1px solid var(--danger); border-radius: 10px;
    color: var(--danger); font-size: 14px;
  }
  .layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 400px;
    gap: 20px;
    align-items: start;
  }
  @media (max-width: 820px) { .layout { grid-template-columns: minmax(0, 1fr); } }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
  }
  label, .label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin: 0 0 6px; }
  .field + .field { margin-top: 16px; }
  input[type=text], textarea, select {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border); border-radius: 10px;
    background: var(--bg); color: var(--text);
    font: inherit; font-size: 16px;
  }
  textarea { min-height: 110px; resize: vertical; }
  input:focus-visible, textarea:focus-visible, select:focus-visible, button:focus-visible {
    outline: 2px solid var(--focus); outline-offset: 1px;
  }
  .chars {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(76px, 1fr));
    gap: 8px;
  }
  .chars button {
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    padding: 6px 4px 6px;
    border: 2px solid var(--border); border-radius: 10px;
    background: var(--paper); color: #22201c;
    font: inherit; font-size: 11px; cursor: pointer;
    min-width: 0;
  }
  .chars button span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .chars button[aria-pressed=true] { border-color: var(--focus); box-shadow: 0 0 0 2px var(--focus) inset; }
  .chars img, .chars .icon { width: 48px; height: 64px; image-rendering: pixelated; }
  .chars .icon { display: grid; place-items: center; font-size: 28px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; }
  .row .field { flex: 1; min-width: 120px; margin-top: 16px; }
  input[type=range] { width: 100%; accent-color: var(--focus); }
  .preview-col { position: sticky; top: 16px; }
  .paper-wrap {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px 8px;
    display: flex; justify-content: center;
    overflow: hidden;
  }
  .paper {
    background: var(--paper);
    padding: 12px 0 0;
    box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 6px 18px rgba(0,0,0,.08);
    max-width: 100%;
    -webkit-mask: linear-gradient(#000 0 0) top / 100% calc(100% - 8px) no-repeat,
      conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) bottom / 16px 8px repeat-x;
    mask: linear-gradient(#000 0 0) top / 100% calc(100% - 8px) no-repeat,
      conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) bottom / 16px 8px repeat-x;
    padding-bottom: 16px;
  }
  #preview { display: block; width: 384px; max-width: 100%; image-rendering: pixelated; }
  .actions { display: flex; gap: 8px; margin-top: 14px; }
  #print {
    flex: 1;
    min-height: 52px;
    border: 0; border-radius: 12px;
    background: var(--accent); color: var(--accent-text);
    font: inherit; font-size: 18px; font-weight: 700; cursor: pointer;
  }
  #print:disabled { opacity: .5; cursor: default; }
  #reroll {
    min-width: 52px; min-height: 52px;
    border: 1px solid var(--border); border-radius: 12px;
    background: var(--card); color: var(--text); font-size: 22px; cursor: pointer;
  }
  .progress { height: 6px; border-radius: 3px; background: var(--border); margin-top: 10px; overflow: hidden; visibility: hidden; }
  .progress.on { visibility: visible; }
  .progress div { height: 100%; width: 0; background: var(--focus); transition: width .1s linear; }
  #toast {
    position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
    max-width: calc(100% - 32px);
    padding: 10px 16px; border-radius: 10px;
    background: var(--accent); color: var(--accent-text); font-size: 14px;
    opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  #toast.show { opacity: 1; }
  #toast.error { background: var(--danger); color: #fff; }
  footer { margin-top: 28px; font-size: 12px; color: var(--muted); text-align: center; }
  footer a { color: inherit; }
</style>
</head>
<body>
<main>
  <header>
    <h1>ChatPrinter<small>キャラクターが喋るレシートを LX-D02 で印刷</small></h1>
    <button id="connect" type="button"><span class="dot"></span><span id="status">プリンタに接続</span></button>
  </header>
  <div id="banner">このブラウザは Web Bluetooth に対応していません。PC / Android の Chrome か Edge で開いてください（プレビューは使えます）。</div>

  <div class="layout">
    <section class="card">
      <div class="field">
        <label for="user">ユーザー名</label>
        <input id="user" type="text" placeholder="ナナシさん" maxlength="40" autocomplete="nickname">
      </div>
      <div class="field">
        <label for="message">メッセージ</label>
        <textarea id="message" placeholder="こんにちは！">こんにちは！</textarea>
      </div>
      <div class="field">
        <span class="label">キャラクター</span>
        <div class="chars" id="chars" role="group" aria-label="キャラクター"></div>
        <input id="file" type="file" accept="image/*" hidden>
      </div>
      <div class="row">
        <div class="field">
          <label for="density">濃度 <output id="density-out">3</output></label>
          <input id="density" type="range" min="1" max="7" value="3">
        </div>
        <div class="field">
          <label for="fontsize">文字サイズ</label>
          <select id="fontsize">
            <option value="20">小</option>
            <option value="24" selected>中</option>
            <option value="30">大</option>
          </select>
        </div>
      </div>
    </section>

    <section class="preview-col">
      <div class="paper-wrap"><div class="paper"><canvas id="preview" width="384" height="200"></canvas></div></div>
      <div class="actions">
        <button id="reroll" type="button" title="キャラクターを選び直す" aria-label="キャラクターを選び直す">🎲</button>
        <button id="print" type="button">印刷する</button>
      </div>
      <div class="progress" id="progress"><div></div></div>
    </section>
  </div>

  <footer>
    Web Bluetooth で LX-D02 / LX-D2 に直接印刷します。プロトコルは
    <a href="https://github.com/cicloid/printable">cicloid/printable</a> を参考にしています。
  </footer>
</main>
<div id="toast" role="status" aria-live="polite"></div>
<script type="module" src="app.js"></script>
</body>
</html>
